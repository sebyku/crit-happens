items:
  rusted_key:
    name: Rusted Key
    description: An old key given to you by a mysterious stranger. It looks like it opens something ancient.
    icon: rusted_key.svg
    max: 1

  iron_sword:
    name: Iron Sword
    description: A well-forged iron sword, sharp and balanced.
    icon: iron_sword.svg
    attack: 6
    max: 1
    slots:
      - right_hand

  wooden_shield:
    name: Wooden Shield
    description: A sturdy wooden shield reinforced with iron bands.
    icon: wooden_shield.svg
    ac: 2
    max: 1
    slots:
      - left_hand

  iron_helmet:
    name: Iron Helmet
    description: A simple but reliable iron helmet.
    icon: iron_helmet.svg
    ac: 1
    max: 1
    slots:
      - head

  torch:
    name: Torch
    description: A wooden torch soaked in oil. Essential for dark places.
    icon: torch.svg
    max: 1
    slots:
      - left_hand

  holy_water:
    name: Holy Water
    description: A vial of blessed water. Throw it at a monster to deal damage.
    icon: holy_water.svg
    combat_damage: 10
    max: 5

  healing_potion:
    name: Healing Potion
    description: A bubbling green potion. Restores health in combat.
    icon: healing_potion.svg
    combat_hp: 30
    max: 3

  legendary_sword:
    name: Legendary Sword
    description: A blade of ancient power found inside a mimic. It hums with energy.
    icon: legendary_sword.svg
    attack: 12
    max: 1
    slots:
      - right_hand

  acier_qualite:
    name: Quality Steel
    description: A rare steel ingot recovered from the goblin's lair.
    icon: acier_qualite.svg
    max: 1

  steel_armor:
    name: Steel Armor
    description: A masterwork armor forged from quality steel.
    icon: steel_armor.svg
    ac: 4
    max: 1
    slots:
      - torso

  carte_orques:
    name: Orc Map
    description: A hand-drawn map showing the path to the orc lair.
    icon: carte_orques.svg
    max: 1

