title: Crit Happens
description: A journey where every choice matters

steps:
  1_start:
    description: You stand in the square of a small village. A fountain trickles softly at the center. Around you, a few buildings catch your eye.
    image: village_square.jpg
    reactions:
      - label: Go to the tavern
        goto: 3_tavern
      - label: Visit the armorer
        goto: 17_armorer
      - label: Enter the church
        goto: 18_church
      - label: Leave the village
        goto: 19_village_exit

  17_armorer:
    description: The armorer's shop is small but well-kept. Swords, shields and helmets line the walls. The blacksmith greets you with a warm smile.
    image: armorer.jpg
    character: blacksmith
    reactions:
      - label: Return to the square
        goto: 1_start

  18_church:
    description: The church is quiet and cool. Light filters through stained glass, casting colors across the wooden pews. A priest notices you and approaches with a gentle smile.
    image: church.jpg
    character: priest
    reactions:
      - label: Return to the square
        goto: 1_start

  19_village_exit:
    description: You leave the village along a dirt path. In the distance, through the trees, you spot the dark entrance of a dungeon. The path leads straight to it.
    image: way_to_dungeon.jpg
    reactions:
      - label: Enter the dungeon
        goto: 2_dark_corridor
        requires_not: shadow_wolf_killed
      - label: Enter the dungeon
        goto: 2b_dark_corridor_cleared
        requires: shadow_wolf_killed
      - label: Go back to the village
        goto: 1_start

  # --- Dark corridor: two variants depending on wolf status ---
  2_dark_corridor:
    description: The corridor stretches ahead, splitting into two paths. From the left, you hear a faint growl. From the right, the glimmer of something shiny catches your eye.
    image: dark_corridor.jpg
    reactions:
      - label: Follow the growl
        goto: 7_beast_lair
      - label: Chase the glimmer
        goto: 10_treasure_room
      - label: Go back to the village
        goto: 1_start

  2b_dark_corridor_cleared:
    description: The corridor stretches ahead. To the left, the passage where the beast once stood is now silent. To the right, you see a faint glimmer.
    image: dark_corridor.jpg
    reactions:
      - label: Go to the beast's passage
        goto: 20b_beast_passage
      - label: Chase the glimmer
        goto: 10_treasure_room
        requires_not: treasure_looted
      - label: Go to the treasure room
        goto: 10b_treasure_looted
        requires: treasure_looted
      - label: Go back to the village
        goto: 1_start

  3_tavern:
    description: The tavern is warm and loud. A hooded stranger beckons you from a corner table, sliding a weathered map across the wood.
    image: tavern.jpg
    reactions:
      - label: Sit with the stranger
        goto: 4_stranger_quest
      - label: Ignore them and order a drink
        goto: 6_tavern_rest
      - label: Return to the square
        goto: 1_start

  4_stranger_quest:
    description: A hooded stranger leans in and starts whispering to you. They seem to know things about the dungeon.
    image: tavern_stranger.jpg
    character: stranger
    reactions:
      - label: Leave the tavern
        goto: 1_start

  5_stranger_details:
    description: '"Trust no one down there," they say. "Especially not the chest that speaks." They vanish into the crowd before you can reply.'
    reactions:
      - label: Return to the square
        goto: 1_start

  6_tavern_rest:
    description: You enjoy a warm meal and a cold ale. Refreshed and ready, you feel the call of adventure pulling you back.
    gold: -2
    hp: 20
    reactions:
      - label: Return to the square
        goto: 1_start

  # --- Beast encounter: only if wolf is alive ---
  7_beast_lair:
    description: A massive wolf-like creature blocks the passage. Its eyes glow a faint blue — it seems more curious than aggressive.
    image: beast_lair.jpg
    reactions:
      - label: Try to calm the beast
        goto: 8_beast_ally
      - label: Draw your weapon
        goto: 9_beast_fight
      - label: Back away slowly
        goto: 2_dark_corridor

  8_beast_ally:
    description: You extend your hand. The beast sniffs cautiously, then nuzzles against it. It steps aside, revealing a hidden passage behind it.
    image: beast_ally.jpg
    reactions:
      - label: Enter the hidden passage
        goto: 12_secret_vault
        requires: rusted_key
      - label: Continue down the corridor
        goto: 10_treasure_room

  9_beast_fight:
    description: The creature lunges at you! Prepare for battle!
    monster: shadow_wolf
    victory_goto: 20_beast_defeated
    flee_goto: 22_flee_corridor
    reactions: []

  20_beast_defeated:
    description: The beast lies still. Behind its body, you notice a hidden passage carved into the stone wall. You find 80 gold coins scattered around its lair.
    image: beast_dead.jpg
    gold: 80
    items_give:
      - shadow_wolf_killed
    reactions:
      - label: Enter the hidden passage
        goto: 12_secret_vault
        requires: rusted_key
      - label: Continue down the corridor
        goto: 10_treasure_room
        requires_not: treasure_looted
      - label: Go to the treasure room
        goto: 10b_treasure_looted
        requires: treasure_looted

  20b_beast_passage:
    description: The beast's lair is silent now. The hidden passage in the stone wall is still there.
    image: beast_dead.jpg
    reactions:
      - label: Enter the hidden passage
        goto: 12_secret_vault
        requires: rusted_key
      - label: Go back to the corridor
        goto: 2b_dark_corridor_cleared

  # --- Treasure room: two variants ---
  10_treasure_room:
    description: A small chamber glitters with gold coins scattered across the floor. In the center sits a wooden chest — and it's... humming?
    image: treasure_room.jpg
    reactions:
      - label: Open the chest
        goto: 11_mimic_encounter
        requires_not: mimic_killed
      - label: Grab the loose coins and leave
        goto: 13_ending_modest
        gold: 15
        items_give:
          - treasure_looted

  10b_treasure_looted:
    description: The treasure room is empty now. Only dust and a few scattered coins remain. There is nothing left of value here.
    image: treasure_room.jpg
    reactions:
      - label: Go back to the corridor
        goto: 2b_dark_corridor_cleared
        requires: shadow_wolf_killed
      - label: Go back to the corridor
        goto: 2_dark_corridor
        requires_not: shadow_wolf_killed

  # --- Mimic: only if not already killed ---
  11_mimic_encounter:
    description: The chest springs open, revealing rows of teeth! It's a mimic! Prepare for battle!
    image: mimic.jpg
    monster: mimic
    victory_goto: 21_mimic_defeated
    flee_goto: 22_flee_corridor
    reactions: []

  21_mimic_defeated:
    description: The mimic shatters into pieces. Inside its hollow body, you find a legendary sword glowing with ancient power.
    items_give:
      - mimic_killed
      - legendary_sword
    reactions:
      - label: Go back to the corridor
        goto: 2_dark_corridor
        requires_not: shadow_wolf_killed
      - label: Go back to the corridor
        goto: 2b_dark_corridor_cleared
        requires: shadow_wolf_killed

  22_flee_corridor:
    description: You run back to the corridor, heart pounding.
    image: dark_corridor.jpg
    reactions:
      - label: Catch your breath
        goto: 2_dark_corridor
        requires_not: shadow_wolf_killed
      - label: Catch your breath
        goto: 2b_dark_corridor_cleared
        requires: shadow_wolf_killed

  12_secret_vault:
    description: You descend into a vast underground vault. Ancient treasures line the walls — relics of a forgotten civilization. At the far end, a glowing crystal pulses with energy.
    items_take:
      - rusted_key
    reactions:
      - label: Take the crystal
        goto: 15_ending_legendary
      - label: Leave it undisturbed
        goto: 16_ending_wise

  13_ending_modest:
    description: You leave the dungeon with pockets full of gold. Not the grandest haul, but enough to live comfortably for a while. Sometimes the smart play is knowing when to walk away.
    reactions: []

  14_ending_hero:
    description: You emerge from the dungeon victorious, carrying a legendary sword. The village will remember your name.
    reactions: []

  15_ending_legendary:
    description: The crystal fills you with ancient power. You emerge from the dungeon forever changed — a living legend. But the crystal's whispers never quite stop...
    reactions: []

  16_ending_wise:
    description: You leave the vault as you found it. Some treasures are not meant to be taken. The dungeon remembers your respect, and the path out is strangely easy.
    reactions: []

  game_over:
    description: Your vision fades to black. The dungeon claims another soul...
    image: game_over.jpg
    reactions: []