items:
  rusted_key:
    name: Clé rouillée
    description: Une vieille clé donnée par un mystérieux étranger. On dirait qu'elle ouvre quelque chose d'ancien.
    icon: rusted_key.svg
    max: 1

  iron_sword:
    name: Épée en fer
    description: Une épée en fer bien forgée, tranchante et équilibrée.
    icon: iron_sword.svg
    attack: 6
    max: 1
    slots:
      - right_hand

  wooden_shield:
    name: Bouclier en bois
    description: Un solide bouclier en bois renforcé de bandes de fer.
    icon: wooden_shield.svg
    ac: 2
    max: 1
    slots:
      - left_hand

  holy_water:
    name: Eau bénite
    description: Une fiole d'eau consacrée. Lancez-la sur un monstre pour infliger des dégâts.
    icon: holy_water.svg
    combat_damage: 10
    max: 5

  shadow_wolf_killed:
    name: Loup des Ombres tué
    hidden: true
    max: 1

  mimic_killed:
    name: Mimic tué
    hidden: true
    max: 1

  treasure_looted:
    name: Trésor pillé
    hidden: true
    max: 1

  legendary_sword:
    name: Épée légendaire
    description: Une lame d'un pouvoir ancien trouvée à l'intérieur d'un mimic. Elle vibre d'énergie.
    icon: legendary_sword.svg
    attack: 12
    max: 1
    slots:
      - right_hand

  iron_helmet:
    name: Casque en fer
    description: Un casque en fer simple mais fiable.
    icon: iron_helmet.svg
    ac: 1
    max: 1
    slots:
      - head