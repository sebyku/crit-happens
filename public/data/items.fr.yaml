items:
  rusted_key:
    name: Clé rouillée
    description: Une vieille clé donnée par un mystérieux étranger. On dirait qu'elle ouvre quelque chose d'ancien.
    icon: rusted_key.svg
    max: 1

  iron_sword:
    name: Épée en fer
    description: Une épée en fer bien forgée, tranchante et équilibrée.
    icon: iron_sword.svg
    attack: 6
    max: 1
    slots:
      - right_hand

  wooden_shield:
    name: Bouclier en bois
    description: Un solide bouclier en bois renforcé de bandes de fer.
    icon: wooden_shield.svg
    ac: 2
    max: 1
    slots:
      - left_hand

  iron_helmet:
    name: Casque en fer
    description: Un casque en fer simple mais fiable.
    icon: iron_helmet.svg
    ac: 1
    max: 1
    slots:
      - head

  torch:
    name: Torche
    description: Une torche en bois imbibée d'huile. Indispensable dans les lieux sombres.
    icon: torch.svg
    max: 1
    slots:
      - left_hand

  holy_water:
    name: Eau bénite
    description: Une fiole d'eau consacrée. Lancez-la sur un monstre pour infliger des dégâts.
    icon: holy_water.svg
    combat_damage: 10
    max: 5

  healing_potion:
    name: Potion de soin
    description: Une potion verte bouillonnante. Restaure de la vie en combat.
    icon: healing_potion.svg
    combat_hp: 30
    max: 3

  legendary_sword:
    name: Épée légendaire
    description: Une lame d'un pouvoir ancien trouvée à l'intérieur d'un mimic. Elle vibre d'énergie.
    icon: legendary_sword.svg
    attack: 12
    max: 1
    slots:
      - right_hand

  acier_qualite:
    name: Acier de qualité
    description: Un lingot d'acier rare récupéré dans le repaire du gobelin.
    icon: acier_qualite.svg
    max: 1

  steel_armor:
    name: Armure en acier
    description: Une armure forgée dans un acier de qualité exceptionnelle.
    icon: steel_armor.svg
    ac: 4
    max: 1
    slots:
      - torso

  carte_orques:
    name: Carte des orques
    description: Une carte dessinée à la main montrant le chemin vers le repaire des orques.
    icon: carte_orques.svg
    max: 1

  # Flags cachés
  cle_donnee:
    name: Clé donnée
    hidden: true
